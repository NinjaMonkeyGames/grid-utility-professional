name: GM-CLI Feature Branch Unit Tests

on:
  workflow_call:
    # Receives the call from CI Controller
jobs:
  run-unit-tests:
    name: Compile and Run Unit Tests Headless
    runs-on: ubuntu-latest
    
    # --privileged allows unshare, chroot, and mount operations
    container:
      image: monkeyknuckles/gm-cli:latest
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Execute Tests Under Virtual Framebuffer
        working-directory: ./grid-utility-professional
        env:
          DISPLAY: :99
        run: |
          # Spin up virtual X11 framebuffer for graphics services
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 2
          # Run the compiled project so internal unit tests can execute
          npx @gamemaker/gm-cli@latest run

      - name: Execute Tests via Script
        working-directory: ./grid-utility-professional
        env:
          DISPLAY: :99
        run: |
          # Make sure the script is executable (or run it via bash explicitly)
          bash ../gml-fail.sh